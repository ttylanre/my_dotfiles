# Auto-install TPM plugins on first run
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
    'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins"'

# ==========================
# ===   General Settings   ===
# ==========================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB" # Enable 24-bit Truecolor support
set -sg terminal-overrides ",*:RGB"            # True color support across overrides
set -as terminal-features ",tmux-256color:RGB"
set -g history-limit 50000                     # Increase scrollback buffer size
set -g buffer-limit 20                         # Maximum copy buffers
set -sg escape-time 0                          # Remove delay for escape keys (crucial for Vim/Nvim)
set -g display-time 1500                       # Message display duration (ms)
set -g repeat-time 300                         # Repeat key press timeout
set -g base-index 1                            # Start window numbering at 1 (matches keyboard layout)
setw -g pane-base-index 1                      # Start pane numbering at 1
set -g mouse on                                # Enable full mouse support (clicking, resizing, scrolling)
set -g renumber-windows on                     # Automatically renumber windows when one is closed
set -g focus-events on                         # Pass focus events to terminal apps (e.g., Neovim)

set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#b4befe"
set -g popup-border-lines rounded

set -g menu-style "bg=#1e1e2e,fg=#cdd6f4"
set -g menu-selected-style "bg=#b4befe,fg=#11111b,bold"
set -g menu-border-style "fg=#585b70"

# Forward Wayland/X11 environment variables cleanly
set -g update-environment "WAYLAND_DISPLAY XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_CURRENT_DESKTOP"

# Clean Window Titles (Auto-renames tab to current working directory name)
set -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ==========================
# ===    TPM PLUGINS     ===
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'       # Seamless navigation between Vim split panes and Tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'         # Persist tmux environment across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'         # Continuous automatic saving of tmux environment
set -g @plugin 'tmux-plugins/tmux-yank'              # System clipboard integration for copy-mode
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'   # Visual status indicator when prefix key is pressed
set -g @plugin 'tmux-plugins/tmux-battery'             # Display battery status in status bar
set -g @plugin 'omerxx/tmux-sessionx'             # Tmux session Manager

set -g @continuum-restore 'on'                   # Automatically restore last saved session on startup
set -g @continuum-save-interval '15'             # Save tmux session state every 15 minutes
set -g @resurrect-capture-pane-contents 'on'    # Restore scrollback/output, not just empty panes
set -g @resurrect-strategy-nvim 'session'       # Restore Neovim sessions on resurrect, not blank buffers
set -g @yank_selection_mouse 'clipboard'       # Force tmux-yank to hit the system clipboard, not primary selection

set -g @sessionx-bind 's'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-ls-command 'eza --icons --tree -F -H --group-directories-first --git -1'
set -g @sessionx-prompt " "
set -g @sessionx-pointer "• "
set -g @sessionx-window-height '90%'
set -g @sessionx-window-width '88%'
set -g @sessionx-additional-options "--color=bg:#1e1e2e,bg+:#313244,fg:#cdd6f4,hl:#b4befe,hl+:#b4befe,pointer:#b4befe,prompt:#94e2d5,info:#cba6f7,header:#89b4fa,border:#585b70"


# Set idle timeout to 300 seconds (5 minutes) of inactivity
set -g lock-after-time 300

# Define what command runs when the session locks (e.g., vlock, lock, or an ASCII screensaver)
set -g lock-command "sh -c '$(shuf -e \"asciiquarium\" \"pipes.sh -c 4\" \"tty-clock -c -s -C 4\")'"
# ==========================
# ===    Key Bindings      ===
# ==========================

# --- Prefix Configuration ---
unbind C-b
set-option -g prefix C-a                       # Set Prefix to Ctrl+a
bind-key C-a send-prefix                       # Send Ctrl+a through to nested apps on double press

# --- Config Management ---
bind r source-file ~/.tmux.conf \; display "󰑓 Config Reloaded!" # Reload config with Prefix + r

# --- Split Panes ---
# Split window horizontally and vertically while preserving the current working directory
bind | split-window -h -c "#{pane_current_path}" # Prefix + | for horizontal split
bind - split-window -v -c "#{pane_current_path}" # Prefix + - for vertical split
unbind '"'
unbind %

# Override default rename to completely lock down the current window title
unbind ,
bind , command-prompt -I "#W" "rename-window '%%'; set-window-option automatic-rename off; set-window-option allow-rename off"

# Vim-style Pane Selection
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# --- Pane Resizing ---
# Fine-tune pane dimensions using capital directions (-r allows key repetition)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Pane Movement ---
# Move current pane up/down in tree layout
bind < swap-pane -U
bind > swap-pane -D

# --- Pane Zoom ---
bind z resize-pane -Z                          # Prefix + z: toggle zoom on the current pane

# --- Quick Kill / Actions ---
bind x kill-pane                               # Prefix + x: kill pane with no confirmation prompt
bind q detach-client                           # Detach client
bind d display-panes                           # Display panes numbers

# --- Window Switching (repeatable) ---
bind -r n select-window -n                     # Prefix + n (repeatable): next window
bind -r p select-window -p                     # Prefix + p (repeatable): previous window

# --- Vim-Tmux-Navigator: seamless pane movement between tmux and Vim/Nvim splits ---
is_vim="ps -o state=,comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# --- Window (Tab) Reordering / Moving ---
bind-key -r S-Left swap-window -t -1 \; select-window -t -1
bind-key -r S-Right swap-window -t +1 \; select-window -t +1

# --- Utilities & Synchronization ---
bind S setw synchronize-panes \; display "Sync panes: #{?pane_synchronized,󰓦 ON,󰓦 OFF}"

# Copy Mode Configuration (Vim Keybindings)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Quick git branch checkout popup
bind g display-popup -E -w 70% -h 60% -d "#{pane_current_path}" "git branch --format='%(refname:short)' | fzf --reverse --header='Checkout Branch' | xargs -r git checkout"

# Interactive Session Switcher Popup
#bind s display-popup -E -w 50% -h 50% "tmux list-sessions -F '#{session_name}' | fzf --reverse --header='Select Session' | xargs -r tmux switch-client -t"

# Quick pane switcher popup
# bind o display-popup -E -w 50% -h 50% "tmux list-panes -F '#{pane_index}: #{pane_current_command} (#{pane_current_path})' | fzf --reverse --header='Jump to Pane' | cut -d':' -f1 | xargs -r tmux select-pane -t"

# Quick volume mixer popup (Prefix + V)
#bind V display-popup -E -w 90% -h 90% "pamixer --tui || alsamixer"

# Quick window switcher popup
#bind o display-popup -E -w 50% -h 50% "\
#  tmux list-windows -F '#{window_index}: #{window_name} (#{window_panes} panes) [#{window_active}]' | \
#  fzf --ansi --reverse --header 'Jump to Window' | \
#  cut -d: -f1 | \
#  xargs -I {} tmux select-window -t :{}"

# Interactive Working Directory Popup
#bind '\' display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# Toggle a dedicated floating scratchpad with Prefix + u
bind '\' if-shell -F '#{==:#{session_name},scratchpad}' {
    detach-client
} {
    popup -d '#{pane_current_path}' -E -w 80% -h 80% 'tmux new-session -A -s scratchpad'
}

# ==============================================================================
# ===   THEME: CATPPUCCIN MOCHA (MUTED EDITION) ===============================
# ==============================================================================

set -g @thm_bg      "#11111b"   # Crust — near-black base
set -g @thm_bg_alt  "#1e1e2e"   # Base — status bar background
set -g @thm_surface "#252638"   # Surface0 (Darkened) — inactive segment fill
set -g @thm_overlay "#313244"   # Surface1 — borders, subtle dividers
set -g @thm_muted   "#585b70"   # Overlay0 — dim text / inactive labels
set -g @thm_fg      "#cdd6f4"   # Text — primary text

set -g @thm_accent   "#b4befe"  # Peach
set -g @thm_accent2  "#cba6f7"  # Mauve
set -g @thm_teal     "#94e2d5"  # Teal
set -g @thm_indigo   "#89b4fa"  # Blue
set -g @thm_green    "#a6e3a1"  # Green
set -g @thm_red      "#f38ba8"  # Red

# Muted Accent Variants
#set -g @thm_accent   "#d4956d"   # Muted Peach — reserved for "active / here"
#set -g @thm_accent2  "#b491c8"   # Muted Mauve — modal emphasis (prefix/copy mode)
#set -g @thm_teal     "#73b8af"   # Muted Teal — session identity
#set -g @thm_indigo   "#7492cc"   # Muted Blue — ambient info (date)
#set -g @thm_green    "#8ab886"   # Muted Green — status-good (battery/time)
#set -g @thm_red      "#e5748c"   # Muted Red — status-alert, reserved for warnings only

# ==============================================================================
# === PREFIX HIGHLIGHT: MINIMAL INDICATOR ======================================
# ==============================================================================

set -g @prefix_highlight_prefix_prompt ' ㅤㅤ'
set -g @prefix_highlight_copy_prompt ' '
set -g @prefix_highlight_fg "#{@thm_bg}"
set -g @prefix_highlight_bg "#{@thm_accent2}"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_empty_prompt ''
set -g @prefix_highlight_empty_attr 'fg=default,bg=default'

# Pane Borders & Messages
set -g pane-border-style "fg=#{@thm_overlay}"
set -g pane-active-border-style "fg=#{@thm_accent}"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#b4befe"
set -g message-style "bg=#{@thm_accent},fg=#{@thm_bg},bold"
set -g message-command-style "bg=#{@thm_surface},fg=#{@thm_fg}"

# Status Bar Base
set -g status-position top
set -g status-justify left
set -g status-style "bg=#{@thm_bg_alt},fg=#{@thm_fg}"
set -g status-interval 5

# Status Left: Session Indicator
set -g status-left-length 60
set -g status-left "#[fg=#{@thm_teal},bg=#{@thm_bg_alt}]#[fg=#{@thm_bg},bg=#{@thm_teal},bold] 󱂬 #S #[fg=#{@thm_teal},bg=#{@thm_bg_alt}]"

# Status Right: System Info Pills
set -g status-right-length 100
set -g status-right "#{prefix_highlight}#[fg=#{@thm_overlay},bg=#{@thm_bg_alt}]#[fg=#{@thm_muted},bg=#{@thm_surface}] 󰁹 #{battery_percentage} #[fg=#{@thm_surface},bg=#{@thm_bg_alt}]#[fg=#{@thm_indigo},bg=#{@thm_surface}] 󰃭 %d-%b #[fg=#{@thm_overlay},bg=#{@thm_bg_alt}]#[fg=#{@thm_bg},bg=#{@thm_green},bold] 󱑎 %H:%M #[fg=#{@thm_green},bg=#{@thm_bg_alt}]"

# ==============================================================================
# === WINDOW TABS: CLEAN RENAMABLE STYLE =======================================
# ==============================================================================

# Enable manual renaming alongside auto-naming
set -g allow-rename on
setw -g automatic-rename on

# Format to show Window Index + Name (e.g., "1: nvim" or just custom names), with spacing on the left
set -g window-status-format " #I"
set -g window-status-current-format " #I:#W#{?window_zoomed_flag, 󰍉,}"

# Clean styling states
set -g window-status-style "fg=#{@thm_muted}"
set -g window-status-current-style "fg=#{@thm_accent},bold"
set -g window-status-bell-style "fg=#{@thm_red},bold"

set -g window-status-separator ""

# Initialize TPM (Keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
